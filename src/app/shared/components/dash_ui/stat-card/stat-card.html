<div class="bg-surface border border-border rounded-2xl p-5 flex flex-col gap-4 shadow-sm">
  <div class="flex items-center justify-between">
    <div [class]="'w-11 h-11 rounded-xl flex items-center justify-center ' + iconBg()">
      <app-icon [name]="icon()" [size]="20" />
    </div>
  </div>
  <div class="space-y-1">
    <app-text variant="cardTitle" [text]="label()" />
    <div class="flex items-end gap-2">
      <app-text variant="cardValue" [text]="value()" />
      <span class="font-body text-[11px] font-medium text-green mb-1">{{ trend() }}</span>
    </div>
    <app-text variant="cardLabel" text="vs last 7 days" />
  </div>
</div>
