<button
  [class]="
    cn(
      'text-white bg-primary w-full rounded-xl p-2 cursor-pointer flex items-center gap-4 justify-center',
      btnClass()
    )
  "
  [type]="type()"
  [disabled]="disabled() || loading()"
>
  @if (textProps()) {
    <app-text
      [variant]="textProps()?.variant || 'navLabel'"
      [text]="textProps()?.text!"
      [class]="textProps()?.class"
    />
  }
  @if (iconProps()) {
    <app-icon [name]="iconProps()?.name!" [size]="17" />
  }
</button>
