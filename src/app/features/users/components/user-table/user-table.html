<!-- Table card -->
<div class="bg-surface border border-border rounded-2xl overflow-hidden">
  <!-- Search -->
  <div class="p-4 border-b border-border">
    <div
      class="flex items-center gap-2 bg-background border border-border rounded-xl px-4 py-2.5 max-w-md"
    >
      <app-icon name="search" />
      <input
        type="text"
        placeholder="Search users..."
        [value]="globalFilter()"
        (input)="globalFilter.set($any($event.target).value)"
        class="flex-1 bg-transparent outline-none font-body text-sm placeholder:text-muted"
      />
    </div>
  </div>

  <ng-template #nameCell let-user>
    <div class="flex items-center gap-2.5">
      <img [src]="user.avatar" class="w-8 h-8 rounded-full object-cover" alt="" />
      <div class="leading-tight">
        <p class="font-body text-sm font-medium text-text">{{ user.name }}</p>
        <p class="font-body text-[11px] text-muted">{{ user.studentId }}</p>
      </div>
    </div>
  </ng-template>

  <ng-template #statusCell let-user>
    <span
      [class]="'px-2.5 py-1 rounded-full text-[11px] font-semibold ' + statusClass(user.status)"
    >
      {{ user.status }}
    </span>
  </ng-template>

  <app-table
    [data]="usersService.users()"

    [globalFilter]="globalFilter()"

      name: nameCell,
      status: statusCell,
      actions: actionsCell,
