<!-- <div class="flex-1"> -->
<main class="pb-8 space-y-6">
  <!-- Welcome -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div>
      <app-text variant="pageTitle" text="Welcome back, Victoria! 👋" />
      <app-text
        variant="pageSubtitle"
        text="Here's an overview of what's happening on StudentHub."
      />
    </div>
    <button
      class="flex items-center gap-2 bg-surface border border-border rounded-xl px-4 py-2.5 self-start sm:self-auto"
    >
      <!-- <app-icon name="calendar" [size]="16" class="text-muted" />
        <span class="font-body text-sm text-text whitespace-nowrap">May 11 – May 17, 2025</span>
        <app-icon name="chevronDown" [size]="16" class="text-muted" /> -->
    </button>
  </div>

  <!-- Stat cards -->
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4">
    @for (stat of stats; track stat.label) {
      <app-stat-card
        [icon]="stat.icon"
        [label]="stat.label"
        [value]="stat.value"
        [trend]="stat.trend"
        [color]="stat.color"
      />
    }
  </div>

  <!-- Charts row -->
  <app-dash-charts />

  <!-- Lists row -->
  <app-dash-lists-section />

  <!-- Bottom row -->
  <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">
    <div class="xl:col-span-2 bg-surface border border-border rounded-2xl p-5">
      <div class="flex items-center justify-between mb-4">
        <app-text variant="sectionTitle" text="Subscription Overview" />
        <span class="font-body text-xs text-muted border border-border rounded-lg px-2.5 py-1"
          >This Month</span
        >
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-primary-light rounded-xl p-4">
          <app-text variant="cardLabel" text="Total Subscribers" />
          <p class="font-body font-bold text-xl text-text mt-1">
            3,584 <span class="text-[11px] font-medium text-green">↑ 8.2%</span>
          </p>
        </div>
        <div class="bg-green-light rounded-xl p-4">
          <app-text variant="cardLabel" text="Active Subscriptions" />
          <p class="font-body font-bold text-xl text-text mt-1">
            3,214 <span class="text-[11px] font-medium text-green">↑ 7.1%</span>
          </p>
        </div>
        <div class="bg-amber-light rounded-xl p-4">
          <app-text variant="cardLabel" text="Revenue (This Month)" />
          <p class="font-body font-bold text-xl text-text mt-1">
            $18,742 <span class="text-[11px] font-medium text-green">↑ 13.6%</span>
          </p>
        </div>
      </div>
    </div>

    <div class="bg-surface border border-border rounded-2xl p-5">
      <app-text variant="sectionTitle" text="Quick Insights" />
      <div class="space-y-3 mt-4">
        @for (insight of insights; track insight) {
          <div class="flex items-start gap-2">
            <!-- <app-icon name="lightbulb" [size]="14" class="text-primary mt-0.5 shrink-0" /> -->
            <span class="font-body text-xs text-text">{{ insight }}</span>
          </div>
        }
      </div>
    </div>
  </div>
</main>
<!-- </div> -->
