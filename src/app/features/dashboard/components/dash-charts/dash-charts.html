<div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
  <!-- User Growth -->
  <div class="bg-surface border border-border rounded-2xl py-5">
    <div class="flex items-center justify-between mb-4 px-4">
      <app-text variant="sectionTitle" text="User Growth" />
      <span class="font-body text-xs text-muted border border-border rounded-lg px-2.5 py-1"
        >Last 7 days</span
      >
    </div>
    <div class="w-full min-w-0">
      <app-line-chart
        [data]="userGrowthData"
        [categories]="chartCategories"
        color="#F0623D"
        [height]="200"
      />
    </div>
  </div>

  <!-- Logins Over Time -->
  <div class="bg-surface border border-border rounded-2xl py-5">
    <div class="flex items-center justify-between mb-4 px-4">
      <app-text variant="sectionTitle" text="Logins Over Time" />
      <span class="font-body text-xs text-muted border border-border rounded-lg px-2.5 py-1"
        >Last 7 days</span
      >
    </div>
    <div class="w-full min-w-0">
      <app-line-chart
        [data]="loginsData"
        [categories]="chartCategories"
        color="#8B5CF6"
        [height]="200"
      />
    </div>
  </div>

  <!-- Users by Platform (donut via conic-gradient) -->
  <div class="bg-surface border border-border rounded-2xl p-5">
    <app-text variant="sectionTitle" text="Users by Platform" />
    <div class="flex items-center gap-6 mt-4">
      <div
        class="w-24 h-24 sm:w-28 sm:h-28 rounded-full flex items-center justify-center shrink-0"
        style="
          background: conic-gradient(
            var(--color-primary) 0% 62.4%,
            var(--color-purple) 62.4% 91.1%,
            var(--color-green) 91.1% 100%
          );
        "
      >
        <div
          class="w-[72%] h-[72%] rounded-full bg-surface flex flex-col items-center justify-center"
        >
          <span class="font-body font-bold text-base sm:text-lg text-text">24,582</span>
          <span class="font-body text-[10px] text-muted">Total Users</span>
        </div>
      </div>
      <div class="space-y-2 min-w-0">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-primary shrink-0"></span>
          <span class="font-body text-xs text-text truncate"
            >Web <span class="text-muted">62.4%</span></span
          >
        </div>
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-purple shrink-0"></span>
          <span class="font-body text-xs text-text truncate"
            >Android <span class="text-muted">28.7%</span></span
          >
        </div>
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-green shrink-0"></span>
          <span class="font-body text-xs text-text truncate"
            >iOS <span class="text-muted">8.9%</span></span
          >
        </div>
      </div>
    </div>
  </div>
</div>
