<!-- Table card -->
<div class="bg-surface border border-border rounded-2xl overflow-hidden">
  <!-- Search -->
  <div class="p-4 border-b border-border">
    <div
      class="flex items-center gap-2 bg-background border border-border rounded-xl px-4 py-2.5 max-w-md"
    >
      <app-icon name="search" />
      <input
        type="text"
        placeholder="Search university..."
        [value]="universityService.search()"
        (input)="universityService.search.set($any($event.target).value)"
        class="flex-1 bg-transparent outline-none font-body text-sm placeholder:text-muted"
      />
    </div>
  </div>

  <ng-template #schoolNameCell let-school>
    <div class="flex items-center gap-2.5">
      <img
        [src]="`https://www.google.com/s2/favicons?domain=${school?.university_domains[0]}&sz=128`"
        class="w-8 h-8 rounded-full object-cover"
        alt="school-logo"
      />
      <app-text [text]="school?.university_name" />
      <div class="leading-tight">
        <p class="font-body text-sm font-medium text-text">{{ school?.fullName }}</p>
      </div>
    </div>
  </ng-template>

  <ng-template #schoolCountryCell let-school>
    <div class="flex items-center gap-2.5">
      <!-- <img

        alt="school-logo"
      /> -->
      <app-text [text]="school?.university_country" />
      <!-- <div class="leading-tight">
        <p class="font-body text-sm font-medium text-text">{{ school?.fullName }}</p>
      </div> -->
    </div>
  </ng-template>

  <ng-template #statusCell let-user> </ng-template>

  <ng-template #joinedCell let-user> </ng-template>

  @if (universityService.universitiesRes.hasValue()) {
    <app-table
      [data]="universityService.universitiesRes.value().universities"
      [columns]="columns"
      [globalFilter]="globalFilter()"
      [cellTemplates]="{
        university_name: schoolNameCell,
        university_country: schoolCountryCell,
        joined: joinedCell,
        actions: actionsCell,
      }"
