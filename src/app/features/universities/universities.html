<div class="space-y-6">
  <!-- Header -->
  <div>
    <app-text variant="pageTitle" text="Universities" />
    <app-text variant="pageSubtitle" text="Manage and monitor all users on StudentHub." />
  </div>

  @if (universities.hasValue()) {
    <!-- Stat cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      @for (stat of universityService.stats(); track stat.label) {
        <app-stat-card
          [icon]="stat.icon"
          [label]="stat.label"
          [value]="stat.value"
          [trend]="stat.trend"
          [color]="stat.color"
        />
      }
    </div>
    <app-university-table />
  }
</div>
