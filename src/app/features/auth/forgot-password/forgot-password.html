<div class="flex flex-col gap-3 mb-8">
  <img src="student_hub.png" alt="Logo" class="w-40" />
  <div>
    <app-text variant="pageTitle" text="Forgot Password?" />
    <app-text variant="pageSubtitle" text="Enter your email address." />
  </div>
</div>

<div class="flex flex-col w-full mb-8 gap-4">
  <app-input
    type="email"
    id="email"
    placeholder="Enter Email Address"
    [field]="forgotPasswordForm.email"
    label="Email Address"
    leftIcon="mail"
  />
</div>

<app-button
  text="Send Reset Link"
  type="submit"
  (click)="router.navigate(['/auth/reset-password'])"
/>
<div class="flex items-center gap-2 mt-4" routerLink="/auth/sign-in">
  <app-icon name="arrowLeft" class="text-primary" />
  <app-text text="Back to login." class="cursor-pointer text-primary text-sm font-semibold" />
</div>
