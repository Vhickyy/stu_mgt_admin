<div class="flex flex-col gap-3 mb-8">
  <img src="student_hub.png" alt="Logo" class="w-40" />
  <div>
    <app-text variant="pageTitle" text="Reset Password" />
    <app-text variant="pageSubtitle" text="Enter your new password." />
  </div>
</div>

<div class="flex flex-col w-full mb-8 gap-4">
  <app-input
    type="password"
    id="newPassword"
    placeholder="Enter Password"
    [field]="resetPasswordForm.newPassword"
    label="New Password"
    leftIcon="lock"
    rightIcon="eye"
  />
  <app-input
    type="password"
    id="confirmPassword"
    placeholder="Enter Password"
    [field]="resetPasswordForm.confirmPassword"
    label="Confirm Password"
    leftIcon="lock"
    rightIcon="eye"
  />
</div>

<app-button text="Reset Password" type="submit" />
<div class="flex items-center gap-2 mt-4" routerLink="/auth/sign-in">
  <app-icon name="arrowLeft" class="text-primary" />
  <app-text text="Back to login." class="cursor-pointer text-primary text-sm font-semibold" />
</div>
