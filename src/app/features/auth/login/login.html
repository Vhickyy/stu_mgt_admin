<div class="flex flex-col gap-3 mb-8">
  <img src="student_hub.png" alt="Logo" class="w-40" />
  <div>
    <app-text variant="pageTitle" text="Welcome" />
    <app-text variant="pageSubtitle" text="Sign in to your admin account." />
  </div>
</div>

<div class="flex flex-col w-full mb-8 gap-4">
  <app-input
    type="email"
    id="email"
    placeholder="Enter Email Address"
    [field]="loginForm.email"
    label="Email Address"
    leftIcon="mail"
  />
  <app-input
    type="password"
    id="password"
    placeholder="Enter Password"
    [field]="loginForm.password"
    label="Password"
    leftIcon="lock"
    rightIcon="eye"
  />
</div>

<app-button text="Login" type="submit" />
<div class="flex justify-between items-center">
  <div class="flex gap-1 mt-2">
    <app-text text="Don't an account?" class="text-sm" />
    <app-text
      text="Sign Up."
      routerLink="/auth/sign-up"
      class="cursor-pointer text-primary text-sm font-semibold"
    />
  </div>
  <app-text
    text="Forgot Password."
    routerLink="/auth/forgot-password"
    class="cursor-pointer text-primary text-sm font-semibold"
  />
</div>
